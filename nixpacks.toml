# Nixpacks configuration for MARCO MALIK & WAQAR WRITES Bot
# This ensures python3 (for yt-dlp) and ffmpeg are installed

[phases.setup]
nixPkgs = ["python3", "ffmpeg", "nodejs_20"]

[phases.build]
cmds = [
  "npm ci",
  "python3 -m venv .venv",
  ".venv/bin/python -m pip install --upgrade pip",
  ".venv/bin/python -m pip install --no-cache-dir 'yt-dlp[default]==2026.10.26'"
]

[start]
cmd = "npm start"
